<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trắc nghiệm Tư tưởng Hồ Chí Minh – 301 câu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f2f4f7; --paper:#ffffff; --ink:#18212b; --muted:#5b6978; --line:#d6dde6;
  --accent:#3446c4; --accent-ink:#ffffff; --accent-soft:#e7eafb;
  --ok:#17794f; --ok-soft:#ddf2e8; --bad:#b4302a; --bad-soft:#fae3e1;
  --flag:#b7791f; --flag-soft:#fbefd3; --code-bg:#101822; --code-ink:#d6e2ef; --grid:rgba(24,33,43,.045);
  --sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e141b; --paper:#161e28; --ink:#e6ecf3; --muted:#93a2b3; --line:#2a3644;
    --accent:#8b9bff; --accent-ink:#0e141b; --accent-soft:#222c52;
    --ok:#4cc38a; --ok-soft:#14352a; --bad:#ff7b72; --bad-soft:#3a1c1b;
    --flag:#e5b34d; --flag-soft:#3a2e12; --code-bg:#0a0f15; --code-ink:#d6e2ef; --grid:rgba(255,255,255,.035);
  }
}
:root[data-theme="dark"]{
  --bg:#0e141b; --paper:#161e28; --ink:#e6ecf3; --muted:#93a2b3; --line:#2a3644;
  --accent:#8b9bff; --accent-ink:#0e141b; --accent-soft:#222c52;
  --ok:#4cc38a; --ok-soft:#14352a; --bad:#ff7b72; --bad-soft:#3a1c1b;
  --flag:#e5b34d; --flag-soft:#3a2e12; --code-bg:#0a0f15; --code-ink:#d6e2ef; --grid:rgba(255,255,255,.035);
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;min-height:100%;font-family:var(--sans);font-size:16px;line-height:1.55;color:var(--ink);
  background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line);padding-top:0}
.top-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 16px}
.brand{background:none;border:0;font-weight:700;letter-spacing:.2px;padding:6px 8px;margin-left:-8px;border-radius:8px}
.brand:hover{background:var(--accent-soft)}
.prog{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.bar{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.prog span{font-size:13px;color:var(--muted);white-space:nowrap}
.timer{font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums;padding:4px 10px;border:1px solid var(--line);border-radius:8px}
.timer.warn{color:var(--bad);border-color:var(--bad)}
.btn{border:1px solid var(--line);background:var(--paper);padding:8px 14px;border-radius:10px;font-weight:500;min-height:40px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.navtoggle{display:none}

main{max-width:1120px;margin:0 auto;padding:20px 16px 48px}

/* start */
.hero{padding:28px 0 8px}
.hero h1{font-size:clamp(30px,5.2vw,50px);line-height:1.08;margin:0 0 14px;font-weight:700;letter-spacing:-.8px}
.wave{display:block;width:min(100%,430px);height:auto;margin:6px 0 18px;color:var(--accent)}
.lede{max-width:60ch;color:var(--muted);margin:0 0 26px;font-size:17px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
.panel h2{font-size:15px;margin:0 0 12px;font-weight:600}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{position:relative;display:block;border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer}
.mode input{position:absolute;opacity:0;inset:0;cursor:pointer}
.mode b{display:block;margin-bottom:2px}
.mode span{font-size:14px;color:var(--muted)}
.mode:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.mode:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:center}
.field{display:flex;flex-direction:column;gap:6px;min-width:180px}
.field label,.field .lab{font-size:13px;color:var(--muted)}
select{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:42px}
.check{display:flex;gap:10px;align-items:center;cursor:pointer;min-height:36px}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.start{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:6px}
.start .btn.primary{padding:12px 26px;font-size:17px;min-height:48px}
.hint{font-size:13px;color:var(--muted)}
.resume{border-color:var(--accent);background:var(--accent-soft)}
.resume p{margin:0 0 12px}

/* test layout */
.test{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px);background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;max-height:calc(100dvh - 100px);overflow:auto}
.side-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.side-h .x{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.grid button{position:relative;height:38px;border:1px solid var(--line);background:var(--paper);border-radius:8px;font-size:13px;font-variant-numeric:tabular-nums;padding:0}
.grid button.done{background:var(--accent-soft);border-color:var(--accent);font-weight:600}
.grid button.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:600}
.grid button.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);font-weight:600}
.grid button.cur{outline:3px solid var(--ink);outline-offset:1px}
.grid button.flag::after{content:"";position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;background:var(--flag);border:2px solid var(--paper)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;border:1px solid var(--line);vertical-align:-2px;margin-right:5px}
.legend .l-done{background:var(--accent-soft);border-color:var(--accent)}
.legend .l-ok{background:var(--ok-soft);border-color:var(--ok)}
.legend .l-bad{background:var(--bad-soft);border-color:var(--bad)}
.legend .l-flag{background:var(--flag);border-color:var(--flag);border-radius:50%}
.kbd{margin-top:14px;font-size:12.5px;color:var(--muted)}
.kbd kbd{font-family:var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--bg)}

.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px}
.meta{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 10px;margin-bottom:6px}
.qno{font-size:22px;font-weight:700;letter-spacing:-.3px}
.qno small{font-size:14px;font-weight:500;color:var(--muted);margin-left:2px}
.chip{font-size:12.5px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);align-self:center}
.chip.st-ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.chip.st-bad{color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}
.chip.st-na{color:var(--flag);border-color:var(--flag);background:var(--flag-soft)}
.group{font-size:13px;color:var(--muted);margin:0 0 16px;overflow-wrap:anywhere}
.stem{font-size:18px;font-weight:500;line-height:1.5;margin:0 0 14px;max-width:72ch;overflow-wrap:anywhere}
.stem.sub{font-weight:400}
.code{background:var(--code-bg);color:var(--code-ink);font-family:var(--mono);font-size:13.5px;line-height:1.55;padding:14px 16px;border-radius:10px;overflow-x:auto;margin:0 0 14px;white-space:pre;tab-size:4}
.code code{font-family:inherit}
.fig{margin:0 0 14px}
.fig img{display:block;max-width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.opt{display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;line-height:1.45}
.opt:hover{border-color:var(--accent)}
.opt .let{flex:none;width:28px;height:28px;border-radius:8px;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:600;font-size:14px;margin-top:-1px}
.opt .otxt{flex:1;min-width:0;overflow-wrap:anywhere;padding-top:2px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .let{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .let{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .let{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[data-static]{pointer-events:none}
.tag{flex:none;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;margin-top:2px}
.tag.ok{color:var(--ok);border:1px solid var(--ok)}
.tag.bad{color:var(--bad);border:1px solid var(--bad)}
.fb{margin:14px 0 0;padding:10px 14px;border-radius:10px;font-weight:600}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.actions{position:sticky;bottom:0;display:flex;gap:10px;justify-content:space-between;align-items:center;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));margin-top:8px;background:linear-gradient(to top,var(--bg) 70%,transparent)}
.flagbtn.on{background:var(--flag-soft);border-color:var(--flag);color:var(--flag);font-weight:600}
.flagbtn::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--flag);margin-right:8px}

/* result */
.res-hero{padding:18px 0 6px}
.res-hero h1{font-size:clamp(26px,4vw,38px);margin:0 0 4px;letter-spacing:-.5px}
.big{font-size:clamp(56px,11vw,104px);font-weight:700;line-height:1;letter-spacing:-3px;font-variant-numeric:tabular-nums}
.big small{font-size:.38em;color:var(--muted);letter-spacing:-1px;font-weight:500}
.sub2{color:var(--muted);margin:6px 0 18px}
.seg{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--line);margin:6px 0 10px}
.seg i{display:block;height:100%}
.seg .s-ok{background:var(--ok)} .seg .s-bad{background:var(--bad)} .seg .s-na{background:var(--line)}
.counts{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:15px}
.counts b{font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)} .dot.na{background:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.brk{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:8px 12px;align-items:center;font-size:14.5px}
.brk .nm small{display:block;color:var(--muted);font-size:12.5px;line-height:1.3}
.brk .tr{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.brk .tr i{display:block;height:100%;background:var(--accent)}
.brk .v{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 14px}
.fchip{border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:6px 14px;font-size:14px}
.fchip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.revlist{display:flex;flex-direction:column;gap:16px}
.empty{color:var(--muted);padding:24px;text-align:center;border:1px dashed var(--line);border-radius:12px}

/* modal */
.scrim2{position:fixed;inset:0;background:rgba(10,15,22,.55);z-index:50;display:grid;place-items:center;padding:16px}
.dlg{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:22px;max-width:440px;width:100%;max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow-y:auto}
.dlg h3{margin:0 0 10px;font-size:20px}
.dlg p{margin:0 0 8px}
.dlg .btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;margin-top:18px}
.scrim{display:none}

@media (max-width:900px){
  .test{grid-template-columns:minmax(0,1fr)}
  .navtoggle{display:inline-flex;align-items:center}
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:40;border-radius:16px 16px 0 0;max-height:72dvh;transform:translateY(105%);transition:transform .22s;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
  body.nav-open .side{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(10,15,22,.5);z-index:35}
  .side-h .x{display:inline-flex}
  .prog span{display:none}
}
@media (max-width:640px){
  .modes,.two{grid-template-columns:1fr}
  .card{padding:16px}
  .stem{font-size:17px}
  .top-in{gap:8px;padding:8px 12px}
  .btn{padding:8px 11px}
  .brand{display:none}
  .actions .btn{padding:8px 10px;font-size:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  {"n":10,"stem":"Phương pháp nào nghiên cứu một cách tổng quát nhằm tìm ra được bản chất của sự vật, hiện tượng?","blocks":[],"opts":["Phương pháp logic","Phương pháp lịch sử","Phương pháp thống kê xã hội học","Phương pháp liên ngành"],"ans":0,"clo":"CLO1","cloTitle":"Ôn tập học phần Tư tưởng Hồ Chí Minh","group":"Bộ câu hỏi cuối kì","type":"NB"},

  {"n":221,"stem":"Điền vào chỗ trống để hoàn thiện định nghĩa văn hóa của Hồ Chí Minh: “Vì lẽ sinh tồn cũng như mục đích của cuộc sống, loài người mới sáng tạo và phát minh ra ngôn ngữ, chữ viết, đạo đức, pháp luật, khoa học, tôn giáo, văn học, nghệ thuật, những công cụ sinh hoạt hằng ngày về mặc, ăn, ở và... Toàn bộ những sáng tạo và phát minh đó tức là văn hóa. Văn hóa là sự tổng hợp của mọi phương thức sinh hoạt cùng với biểu hiện của nó mà loài người đã sản sinh ra nhằm thích ứng những nhu cầu đời sống và đòi hỏi của sự sinh tồn”.","blocks":[],"opts":["Các phương thức sử dụng","Các hình thức thể hiện","Mọi phương tiện tồn tại","Mọi hình thức tồn tại"],"ans":0,"clo":"CLO1","cloTitle":"Ôn tập học phần Tư tưởng Hồ Chí Minh","group":"Bộ câu hỏi cuối kì","type":"NB"},
  {"n":222,"stem":"Điền vào chỗ trống sao cho cho phù hợp với quan điểm của Hồ Chí Minh: “Muốn tiến lên chủ nghĩa xã hội thì phải phát triển kinh tế và văn hóa. Vì sao không nói phát triển văn hóa và kinh tế. Tục ngữ ta có câu: Có thực mới vực được đạo, vì thế.....”","blocks":[],"opts":["Kinh tế phải đi trước","Phải phát triển kinh tế","Kinh tế được đi trước","Phải ưu tiên kinh tế"],"ans":0,"clo":"CLO1","cloTitle":"Ôn tập học phần Tư tưởng Hồ Chí Minh","group":"Bộ câu hỏi cuối kì","type":"NB"},

  {"n":240,"stem":"Theo Hồ Chí Minh, những phẩm chất đạo đức cơ bản của con người Việt Nam trong thời đại mới bao gồm:","blocks":[],"opts":["Trung với nước, hiếu với dân; yêu thương con người; cần kiệm liêm chính, chí công vô tư; tinh thần quốc tế trong sáng.","Trung với nước, hiếu với dân, yêu thương con người","Trung với nước, hiếu với dân, cần kiệm liêm chính, chí công vô tư.","Trung với nước, hiếu với dân, cần, kiệm, liêm, chính, chí công vô tư, yêu thương con người"],"ans":0,"clo":"CLO1","cloTitle":"Ôn tập học phần Tư tưởng Hồ Chí Minh","group":"Bộ câu hỏi cuối kì","type":"NB"},

  {"n":253,"stem":"Luận điểm về đạo đức nào sau đâyđược Hồ Chí Minh thể hiện trong tác phẩm “Sửa đổi lối làm việc”?","blocks":[],"opts":["Người cách mạng phải có đạo đức, không có đạo đức thì dù tài giỏi mấy cũng không lãnh đạo được nhân dân.","Cần, kiệm, liêm, chính là nền tảng của Đời sống mới là nền tảng của thi đua ái quốc.","Đạo đức cách mạng không phải trên trời sa xuống. Nó do đấu tranh, rèn luyện bền bỉ hằng ngày mà phát triển và củng cố. Cũng như ngọc càng mài càng sáng, vàng càng luyện càng trong.","Đem lòng “chí công vô tư” mà đối với người, với việc. Đối nghịch với “chí công vô tư” là “dĩ công vi tư”, đó là điều mà đạo đức mới đòi hỏi phải chống lại"],"ans":0,"clo":"CLO1","cloTitle":"Ôn tập học phần Tư tưởng Hồ Chí Minh","group":"Bộ câu hỏi cuối kì","type":"NB"},
  {"n":254,"stem":"Trong những luận điểm sau đây về đạo đức, luận điểm nào được Hồ Chí Minh viết trong tác phẩm “Cần, Kiệm, Liêm, Chính”?","blocks":[],"opts":["Chớ nịnh hót người trên. Chớ xem khinh người dưới. Thái độ phải chân thành, khiêm tốn, phải thật thà đoàn kết. Phải học người và giúp người tiến tới, phải thực hành chữ Bác - Ái.","Đạo đức cách mạng không phải trên trời sa xuống. Nó do đấu tranh, rèn luyện bền bỉ hàng ngày mà phát triển và củng cố. Cũng như ngọc càng mài càng sáng vàng càng luyện càng trong.","Đảng ta là một Đảng cầm quyền. Mỗi đảng viên và cán bộ phải thật sự thấm nhuần đạo đức cách mạng, thật sự cần kiệm liêm chính, chí công vô tư.","Người cách mạng phải có đạo đức, không có đạo đức thì dù có tài giỏi mấy cũng không lãnh đạo được nhân dân."],"ans":0,"clo":"CLO1","cloTitle":"Ôn tập học phần Tư tưởng Hồ Chí Minh","group":"Bộ câu hỏi cuối kì","type":"NB"},
  {"n":255,"stem":"Luận điểm về đạo đức nào sau đây được Hồ Chí Minh thể hiện trong tác phẩm “Cần, Kiệm, Liêm, Chính”?","blocks":[],"opts":["Việc thiện thì dù nhỏ mấy cũng làm. Việc ác thì dù nhỏ mấy cũng tránh. Việc gì có lợi cho mình, phải xét nó có lợi cho nước không, mà có hại cho nước thì quyết không làm.","Đạo đức cách mạng không phải trên trời rơi xuống. Nó do đấu tranh, rèn luyện bền bỉ hằng ngày mà phát triển và củng cố. Cũng như ngọc càng mài càng sáng, vàng càng luyện càng trong.","Đảng ta là một đảng cầm quyền. Mỗi đảng viên và cán bộ phải thật sự thấm nhuần đạo đức cách mạng, thật sự cần kiệm liêm chính, chí công vô tư.","Người cách mạng phải có đạo đức, không có đạo đức thì dù có tài giỏi mấy cũng không lãnh đạo được nhân dân."],"ans":0,"clo":"CLO1","cloTitle":"Ôn tập học phần Tư tưởng Hồ Chí Minh","group":"Bộ câu hỏi cuối kì","type":"NB"},
  {"n":256,"stem":"Câu nói: “Nói chung thì các dân tộc phương Đông đều giàu tình cảm, và đối với họ một tấm gương sống còn có giá trị hơn một trăm bài diễn văn tuyên truyền” được Hồ Chí Minh viết trong tác phẩm nào?","blocks":[],"opts":["Thư gửi đồng chí Pêtơrốp, Tổng Thư ký Ban phương Đông","Lênin và các dân tộc phương Đông","Thư gửi cho một đồng chí Quốc tế Cộng sản","Thư gửi Trung ương Đảng Cộng sản Pháp"],"ans":0,"clo":"CLO1","cloTitle":"Ôn tập học phần Tư tưởng Hồ Chí Minh","group":"Bộ câu hỏi cuối kì","type":"NB"},
  {"n":257,"stem":"Hồ Chí Minh viết: “Trời có bốn mùa: Xuân, Hạ, Thu, Đông Đất có bốn phương: Đông, Tây, Nam, Bắc Người có bốn đức: Cần, Kiệm, Kiêm, Chính Thiếu một mùa, thì không thành trời Thiếu một phương, thì không thành đất Thiếu một đức thì không thành người” Sáu câu thơ trên được Người viết trong tác phẩm nào sau đây:","blocks":[],"opts":["Cần Kiệm Liêm Chính","Đạo đức cách mạng","Đời sống mới","Sửa đổi lối làm việc"],"ans":0,"clo":"CLO1","cloTitle":"Ôn tập học phần Tư tưởng Hồ Chí Minh","group":"Bộ câu hỏi cuối kì","type":"NB"},
  {"n":258,"stem":"Phương án nào sau đây diễn đạt SAI nội dung Tư tưởng Hồ Chí Minh về Cần, Kiệm, Liêm, Chính?","blocks":[],"opts":["Cần là làm việc gì cũng phải tính toán kỹ lưỡng, phải đặt lợi ích của Đảng, của dân tộc lên trên hết, trước hết.","Kiệm là tiết kiệm, không xa xỉ, không hoang phí, không bừa bãi.","Liêm là trong sạch, không tham lam","Chính nghĩa là không tà, nghĩa là thẳng thắn, đúng đắn"],"ans":0,"clo":"CLO1","cloTitle":"Ôn tập học phần Tư tưởng Hồ Chí Minh","group":"Bộ câu hỏi cuối kì","type":"NB"},

  {"n":264,"stem":"Trong bài“Mừng Tết Nguyên đán thế nào?” (năm1960), Hồ Chí Minh đưa ra lời khuyên: “Trăm năm trong cõi người ta Cần kiệm xây dựng nước nhà mới ngoan Mừng Xuân, Xuân cả thế gian Phải đâu lãng phí cổ bàn mới Xuân” Trong bốn câu thơ trên, Hồ Chí Minh đã đề cập tới phẩm chất đạo đức nào sau đây?","blocks":[],"opts":["Chuẩn mực đạo đức","Nguyên tắc đạo đức","Vai trò và sức mạnh của đạo đức","Chuẩn mực và nguyên tắc đạo đức."],"ans":0,"clo":"CLO1","cloTitle":"Ôn tập học phần Tư tưởng Hồ Chí Minh","group":"Bộ câu hỏi cuối kì","type":"NB"},

  {"n":266,"stem":"Hồ Chí Minh chỉ rõ: “Cũng như sông thì có nguồn mới có có nước, không có nguồn thì sông cạn. Cây phải có gốc, không có gốc thì cây héo. Người cách mạng phải có đạo đức, không có đạo đức thì có tài giỏi mấy cũng không lãnh đạo được nhân dân” là đề cập đến:","blocks":[],"opts":["Vai trò và sức mạnh đạo đức","Các chuẩn mực đạo đức cách mạng","Nguyên tắc xây dựng đạo đức mới","Chuẩn mực và nguyên tắc xây dựng đạo đức mới"],"ans":0,"clo":"CLO1","cloTitle":"Ôn tập học phần Tư tưởng Hồ Chí Minh","group":"Bộ câu hỏi cuối kì","type":"NB"},
  {"n":267,"stem":"Hồ Chí Minh chỉ rõ: “Làm cách mạng để cải tạo xã hội cũ thành xã hội mới là một sự nghiệp rất vẻ vang, nhưng nó cũng là một nhiệm vụ rất nặng nề, một cuộc đấu tranh rất phức tạp, lâu dài, gian khổ. Sức có mạnh mới gánh được nặng và đi được xa. Người cách mạng phải có đạo đức cách mạng làm nền tảng, mới hoàn thành được nhiệm vụ cách mạng vẻ vang” là đề cập đến:","blocks":[],"opts":["Vai trò và sức mạnh của đạo đức","Nguyên tắc xây dựng đạo đức mới","Các chuẩn mực đạo đức cách mạng","Chuẩn mực và nguyên tắc xây dựng đạo đức"],"ans":0,"clo":"CLO1","cloTitle":"Ôn tập học phần Tư tưởng Hồ Chí Minh","group":"Bộ câu hỏi cuối kì","type":"NB"},
  {"n":268,"stem":"Hồ Chí Minh chỉ rõ: “Trước mặt quần chúng, không phải ta cứ viết lên trán chữ “cộng sản” mà ta được họ yêu mến, quần chúng chỉ quý mến những người có tư cách đạo đức” là đề cập đến:","blocks":[],"opts":["Vai trò, sức mạnh của đạo đức","Các chuẩn mực đạo đức cách mạng","Nguyên tắc xây dựng đạo đức mới","Chuẩn mực và nguyên tắc xây dựng đạo đức"],"ans":0,"clo":"CLO1","cloTitle":"Ôn tập học phần Tư tưởng Hồ Chí Minh","group":"Bộ câu hỏi cuối kì","type":"NB"},
  {"n":269,"stem":"Hồ Chí Minh chỉ rõ: “Vì muốn giải phóng cho dân tộc, giải phóng cho loài người là một công việc to tát, mà tự mình không có đạo đức, không có căn bản, tự mình đã hủ hóa, xấu xa thì làm nổi việc gì?” là đề cập đến:","blocks":[],"opts":["Vai trò và sức mạnh của đạo đức","Chuẩn mực và nguyên tắc xây dựng đạo đức","Nguyên tắc xây dựng đạo đức mới","Các chuẩn mực đạo đức cách mạng"],"ans":0,"clo":"CLO1","cloTitle":"Ôn tập học phần Tư tưởng Hồ Chí Minh","group":"Bộ câu hỏi cuối kì","type":"NB"},
  {"n":270,"stem":"Hồ Chí Minh chỉ rõ: “Có đạo đức cách mạng thì khi gặp thuận lợi và thành công vẫn giữ vững tinh thần gian khổ, chất phác, khiêm tốn, “lo trước thiên hạ, vui sau thiên hạ”, lo hoàn thành nhiệm vụ cho tốt chứ không kèn cựa về mặt hưởng thụ, không công thần, không quan liêu, không kiêu ngạo, không hủ hóa” là đề cập đến:","blocks":[],"opts":["Vai trò và sức mạnh của đạo đức","Chuẩn mực và nguyên tắc xây dựng đạo đức","Nguyên tắc xây dựng đạo đức mới","Các chuẩn mực đạo đức cách mạng"],"ans":0,"clo":"CLO1","cloTitle":"Ôn tập học phần Tư tưởng Hồ Chí Minh","group":"Bộ câu hỏi cuối kì","type":"NB"},
  {"n":271,"stem":"Hồ Chí Minh chỉ rõ: “Nói chung thì các dân tộc phương Đông đều giàu tình cảm, và đối với họ một tấm gương sống còn có giá trị hơn một trăm bài diễn văn tuyên truyền” là đề cập đến:","blocks":[],"opts":["Vai trò và sức mạnh của đạo đức","Nguyên tắc xây dựng đạo đức mới","Các chuẩn mực đạo đức cách mạng","Chuẩn mực và nguyên tắc xây dựng đạo đức"],"ans":0,"clo":"CLO1","cloTitle":"Ôn tập học phần Tư tưởng Hồ Chí Minh","group":"Bộ câu hỏi cuối kì","type":"NB"},
  {"n":272,"stem":"Hồ Chí Minh khuyên: “Không tham địa vị, không tham tiền tài, không tham sung sướng, không ham người tâng bốc mình... chỉ có một thứ ham là ham học, ham làm, ham tiến bộ” là đề cập đến:","blocks":[],"opts":["Các chuẩn mực đạo đức cách mạng","Nguyên tắc xây dựng đạo đức mới","Vai trò và sức mạnh của đạo đức","Chuẩn mực và nguyên tắc xây dựng đạo đức"],"ans":0,"clo":"CLO1","cloTitle":"Ôn tập học phần Tư tưởng Hồ Chí Minh","group":"Bộ câu hỏi cuối kì","type":"NB"},
  {"n":273,"stem":"Hồ Chí Minh dạy: “Làm việc phải đến đúng giờ, chớ đến trễ, về sớm. Làm cho chóng, cho chu đáo. Việc ngày nào nên làm xong ngày ấy, chớ để ngày mai. Phải nhớ rằng: dân đã lấy tiền mồ hôi nước mắt để trả lương cho ta trong những thì giờ đó. Ai lười biếng tức là lừa gạt dân” là đề cập đến:","blocks":[],"opts":["Các chuẩn mực đạo đức cách mạng","Vai trò và sức mạnh của đạo đức","Nguyên tắc xây dựng đạo đức mới","Chuẩn mực và nguyên tắc xây dựng đạo đức"],"ans":0,"clo":"CLO1","cloTitle":"Ôn tập học phần Tư tưởng Hồ Chí Minh","group":"Bộ câu hỏi cuối kì","type":"NB"},
  {"n":274,"stem":"Hồ Chí Minh nói: “...làm việc công phải có công tâm, công đức. Chớ đem của công dùng vào việc tư. Chớ đem người tư làm việc công. Việc nào cũng phải công bình, chính trực, không nên vì tư ân, tư huệ, hoặc tư thù, tư oán. Mình có quyền dùng người thì phải dùng những người có tài năng, làm được việc. Chớ vì bà con bầu bạn, mà kéo vào chức nọ chức kia. Chớ vì sợ mất địa vị mà dìm những kẻ có tài năng hơn mình” là đề cập đến:","blocks":[],"opts":["Các chuẩn mực đạo đức cách mạng","Vai trò và sức mạnh của đạo đức","Nguyên tắc xây dựng đạo đức mới","Chuẩn mực và nguyên tắc xây dựng đạo đức"],"ans":0,"clo":"CLO1","cloTitle":"Ôn tập học phần Tư tưởng Hồ Chí Minh","group":"Bộ câu hỏi cuối kì","type":"NB"},
  {"n":275,"stem":"Hồ Chí Minh nói: “Đạo đức cách mạng không phải trên trời sa xuống. Nó do đấu tranh, rèn luyện bền bỉ hằng ngày mà phát triển và củng cố. Cũng như ngọc càng mài càng sáng, vàng càng luyện càng trong” là đề cập đến","blocks":[],"opts":["Nguyên tắc xây dựng đạo đức mới","Vai trò và sức mạnh của đạo đức","Các chuẩn mực đạo đức cách mạng","Chuẩn mực và nguyên tắc xây dựng đạo đức"],"ans":0,"clo":"CLO1","cloTitle":"Ôn tập học phần Tư tưởng Hồ Chí Minh","group":"Bộ câu hỏi cuối kì","type":"NB"},

  {"n":280,"stem":"Hồ Chí Minh nói: “Mỗi con người đều có thiện và ác ở trong lòng. Ta phải biết làm cho phần tốt ở trong mỗi con người nảy nở như hoa mùa xuân và phần xấu bị mất dần đi, đó là thái độ của người cách mạng. Đối với những người có thói hư tật xấu, trừ hạng người phản bội lại Tổ quốc và nhân dân, ta cũng phải giúp họ tiến bộ bằng cách làm cho cái phần thiện trong con người nảy nở để đẩy lùi phần ác, chứ không phải đập cho tơi bời” là đề cập đến:","blocks":[],"opts":["Nguyên tắc xây dựng đạo đức mới","Chuẩn mực và nguyên tắc xây dựng đạo đức","Vai trò và sức mạnh của đạo đức","Các chuẩn mực đạo đức cách mạng"],"ans":0,"clo":"CLO1","cloTitle":"Ôn tập học phần Tư tưởng Hồ Chí Minh","group":"Bộ câu hỏi cuối kì","type":"NB"},

  {"n":294,"stem":"Theo Hồ Chí Minh thì HỌC để làm gì?","blocks":[],"opts":["Để làm việc, làm người, làm cán bộ","Để làm việc tốt hơn","Để làm người tốt hơn","Để làm cán bộ tốt hơn"],"ans":0,"clo":"CLO1","cloTitle":"Ôn tập học phần Tư tưởng Hồ Chí Minh","group":"Bộ câu hỏi cuối kì","type":"NB"},
  {"n":295,"stem":"Theo Hồ Chí Minh, mục tiêu của giáo dục là gì?","blocks":[],"opts":["Đào tạo những con người tốt, những cán bộ tốt","Xóa nạn mù chữ, làm cho mọi người dân biết đọc biết viết","Hình thành đội ngũ tri thức cách mạng","Phát triển khoa học nước nhà"],"ans":0,"clo":"CLO1","cloTitle":"Ôn tập học phần Tư tưởng Hồ Chí Minh","group":"Bộ câu hỏi cuối kì","type":"NB"},
  {"n":296,"stem":"Theo Hồ Chí Minh, nội dung của nền giáo dục mới là:","blocks":[],"opts":["Giáo dục toàn diện cả đức, trí, thể, mỹ","Giáo dục tư tưởng chính trị","Giáo dục thái độ lao động","Giáo dục tri thức văn hóa"],"ans":0,"clo":"CLO1","cloTitle":"Ôn tập học phần Tư tưởng Hồ Chí Minh","group":"Bộ câu hỏi cuối kì","type":"NB"},
  {"n":297,"stem":"Theo Hồ Chí Minh, trong mỗi con người bao giờ cũng có:","blocks":[],"opts":["Tốt - xấu - thiện ác","Mặt tốt - trung thực – tích cực","Mặt xấu - hạn chế - lười biếng","Không xấu - không tốt"],"ans":0,"clo":"CLO1","cloTitle":"Ôn tập học phần Tư tưởng Hồ Chí Minh","group":"Bộ câu hỏi cuối kì","type":"NB"},
  {"n":298,"stem":"Theo Hồ Chí Minh, hạn chế của nền giáo dục phong kiến là:","blocks":[],"opts":["Từ chương, kinh viện, xa rời thực tế, bất bình đẳng, trọng nam khinh nữ","Từ chương, kinh viện, giáo điều sách vở","Bất bình đẳng, trọng nam khinh nữ","Xa rời thực tiễn, chỉ lý thuyết suông"],"ans":0,"clo":"CLO1","cloTitle":"Ôn tập học phần Tư tưởng Hồ Chí Minh","group":"Bộ câu hỏi cuối kì","type":"NB"},
  {"n":299,"stem":"Câu nói: “Một dân tộc dốt là một dân tộc yếu” được trích từ bài viết nào của Hồ Chí Minh?","blocks":[],"opts":["Những nhiệm vụ cấp bách của Nhà nước Việt Nam Dân chủ Cộng hòa","Chống nạn thất học","Thư gửi các học sinh","Đời sống mới"],"ans":0,"clo":"CLO1","cloTitle":"Ôn tập học phần Tư tưởng Hồ Chí Minh","group":"Bộ câu hỏi cuối kì","type":"NB"},
  {"n":300,"stem":"Bài viết đầu tiên của Hồ Chí Minh về “Tết trồng cây” xuất hiện vào thời gian nào?","blocks":[],"opts":["Ngày 28-11-1959","Ngày 28-11-1967","Ngày 28-11-1958","Ngày 28-11-1960"],"ans":0,"clo":"CLO1","cloTitle":"Ôn tập học phần Tư tưởng Hồ Chí Minh","group":"Bộ câu hỏi cuối kì","type":"NB"},
  {"n":301,"stem":"Ai là tác giả của hai câu thơ: “Hiền dữ phải đâu là tính sẵn Phần nhiều do giáo dục mà nên”","blocks":[],"opts":["Hồ Chí Minh (1890-1969): Lãnh tụ vĩ đại của nhân dân Việt Nam","Khổng Tử (551 TCN-479TCN): Nhà giáo dục lớn thời cổ đại Trung Hoa","Mahatma Gandi (1869-1948): Nhà lãnh tụ vĩ đại của nhân dân Ấn Độ","Giesu Crit người sáng lập Kito giáo ở phương Tây."],"ans":0,"clo":"CLO1","cloTitle":"Ôn tập học phần Tư tưởng Hồ Chí Minh","group":"Bộ câu hỏi cuối kì","type":"NB"}
]</script>
<script>
(function(){
'use strict';
var DATA=JSON.parse(document.getElementById('data').textContent);
var LET=['A','B','C','D'];
var TYPE={NB:'Nhận biết',TH:'Thông hiểu',VD:'Vận dụng'};
var KEY='ktvxl100_session_v1';
var S=null,timerId=null,ui={modal:false,filter:'all'};
function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function fmt(ms){ms=Math.max(0,Math.round(ms/1000));var h=Math.floor(ms/3600),m=Math.floor(ms%3600/60),s=ms%60;var p=function(n){return (n<10?'0':'')+n};return (h?h+':':'')+p(m)+':'+p(s)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{var r=localStorage.getItem(KEY);if(!r)return null;var o=JSON.parse(r);if(o&&o.v===1&&Array.isArray(o.order)&&o.order.length)return o}catch(e){}return null}
function clearSaved(){try{localStorage.removeItem(KEY)}catch(e){}}

/* ---------- start ---------- */
function showStart(){
  stopTimer();ui.modal=false;document.body.dataset.view='start';document.body.classList.remove('nav-open');
  $('#top').hidden=true;
  var saved=S||load();
  var cnt=function(c){return DATA.filter(function(q){return q.clo===c}).length};
  var scopes={};
  DATA.forEach(function(q){if(!scopes[q.clo])scopes[q.clo]=scopeName(q)});
  var resume='';
  if(saved){
    var done=Object.keys(saved.ans).length,tot=saved.order.length;
    resume='<section class="panel resume"><h2>'+(saved.submitted?'Bài làm gần nhất đã nộp':'Bạn đang làm dở một bài')+'</h2>'+
      '<p>'+(saved.submitted?'Đã nộp bài với ':'Đã trả lời ')+done+'/'+tot+' câu.</p>'+
      '<div class="row"><button class="btn primary" id="resume">'+(saved.submitted?'Xem lại kết quả':'Tiếp tục làm bài')+'</button>'+
      (saved.submitted?'':'<button class="btn" id="discard">Bỏ bài này</button>')+'</div></section>';
  }
  $('#view').innerHTML=
  '<section class="hero"><h1>Tư tưởng Hồ Chí Minh<br>Trắc nghiệm '+DATA.length+' câu</h1>'+
  '<svg class="wave" viewBox="0 0 600 40" aria-hidden="true"><path d="M2 32H42V8H102V32H162V8H222V32H282V8H342V32H402V8H462V32H522V8H582" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="miter"/></svg>'+
  '<p class="lede">Ôn tập học phần Tư tưởng Hồ Chí Minh.</p></section>'+
  resume+
  '<section class="panel"><h2>Chế độ làm bài</h2><div class="modes">'+
    '<label class="mode"><input type="radio" name="mode" value="practice" checked><b>Luyện tập</b><span>Chọn xong biết đúng/sai ngay, câu đã trả lời được khóa.</span></label>'+
    '<label class="mode"><input type="radio" name="mode" value="exam"><b>Thi thử</b><span>Chỉ biết kết quả sau khi nộp bài, được đổi đáp án tự do.</span></label>'+
  '</div></section>'+
  '<section class="panel"><h2>Tùy chọn</h2><div class="row">'+
    '<div class="field"><label for="scope">Phạm vi</label><select id="scope"><option value="all">Toàn bộ '+DATA.length+' câu</option>'+
      Object.keys(scopes).map(function(c){return '<option value="'+esc(c)+'">'+esc(scopes[c])+' ('+cnt(c)+' câu)</option>'}).join('')+'</select></div>'+
    '<div class="field"><label for="mins">Thời gian</label><select id="mins"><option value="0">Không giới hạn</option><option value="30">30 phút</option><option value="60">60 phút</option><option value="90">90 phút</option><option value="120">120 phút</option></select></div>'+
    '<div class="field"><span class="lab">Trộn</span><label class="check"><input type="checkbox" id="shq"> Thứ tự câu hỏi</label><label class="check"><input type="checkbox" id="sho"> Thứ tự đáp án</label></div>'+
  '</div></section>'+
  '<div class="start"><button class="btn primary" id="go">Bắt đầu làm bài</button><span class="hint">Phím tắt: A–D chọn đáp án, ← → chuyển câu, F đánh dấu.</span></div>';
  $('#go').onclick=function(){
    var cfg={mode:document.querySelector('input[name=mode]:checked').value,scope:$('#scope').value,minutes:+$('#mins').value,shuffleQ:$('#shq').checked,shuffleO:$('#sho').checked};
    startSession(cfg);
  };
  if($('#resume'))$('#resume').onclick=function(){S=saved;S.submitted?showResult():resumeTest()};
  if($('#discard'))$('#discard').onclick=function(){S=null;clearSaved();showStart()};
  window.scrollTo(0,0);
}

function startSession(cfg,subset){
  var idx=subset||DATA.map(function(_,i){return i}).filter(function(i){return cfg.scope==='all'||DATA[i].clo===cfg.scope});
  if(cfg.shuffleQ)idx=shuffle(idx);
  var perm={};idx.forEach(function(i){perm[i]=cfg.shuffleO?shuffle([0,1,2,3]):[0,1,2,3]});
  var now=Date.now();
  S={v:1,cfg:cfg,order:idx,perm:perm,ans:{},flags:{},i:0,startedAt:now,endAt:cfg.minutes?now+cfg.minutes*60000:null,submitted:false,submittedAt:null};
  save();showTest();
}
function resumeTest(){
  if(S.endAt&&Date.now()>=S.endAt){submit();return}
  showTest();
}

/* ---------- test ---------- */
function showTest(){
  document.body.dataset.view='test';document.body.classList.remove('nav-open');ui.modal=false;
  $('#top').hidden=false;
  $('#top').innerHTML='<div class="top-in"><button class="brand" id="home" title="Về trang đầu (bài làm được lưu)">Tư tưởng Hồ Chí Minh - '+DATA.length+' câu</button>'+
    '<div class="prog"><div class="bar"><i id="pbar"></i></div><span id="ptxt"></span></div>'+
    (S.endAt?'<span class="timer" id="timer" role="timer"></span>':'')+
    '<button class="btn navtoggle" id="navt">Danh sách</button>'+
    '<button class="btn primary" id="sub">Nộp bài</button></div>';
  $('#view').innerHTML='<div class="test"><section id="qwrap"></section><aside class="side" id="side" aria-label="Danh sách câu hỏi"></aside></div>';
  $('#home').onclick=function(){save();showStart()};
  $('#sub').onclick=openSubmit;
  $('#navt').onclick=function(){document.body.classList.add('nav-open')};
  $('#qwrap').onclick=function(e){
    var o=e.target.closest('.opt[data-o]');if(o&&!o.hasAttribute('data-static')){choose(+o.dataset.o);return}
    var a=e.target.closest('[data-act]');if(!a)return;
    var act=a.dataset.act;
    if(act==='prev')go(S.i-1);else if(act==='next')go(S.i+1);else if(act==='flag')toggleFlag();
  };
  $('#side').onclick=function(e){
    var b=e.target.closest('[data-go]');if(b){document.body.classList.remove('nav-open');go(+b.dataset.go);return}
    if(e.target.closest('#closeNav'))document.body.classList.remove('nav-open');
  };
  drawQuestion();drawNav();drawTop();startTimer();
  window.scrollTo(0,0);
}
$('#scrim').onclick=function(){document.body.classList.remove('nav-open')};

function scopeName(q){return q.cloTitle.replace(/^Ôn tập học phần\s+/,'')}
function qBody(q){
  var h='<p class="stem">'+esc(q.stem)+'</p>';
  q.blocks.forEach(function(b){
    if(b.k==='code')h+='<pre class="code" tabindex="0"><code>'+esc(b.v)+'</code></pre>';
    else if(b.k==='img')h+='<figure class="fig"><img src="'+b.v+'" alt="Hình minh họa cho câu '+q.n+'"></figure>';
    else h+='<p class="stem sub">'+esc(b.v)+'</p>';
  });
  return h;
}
function optsHTML(qi,reveal,interactive){
  var q=DATA[qi],p=S.perm[qi],chosen=S.ans[qi];
  return '<div class="opts" role="radiogroup" aria-label="Đáp án">'+p.map(function(o,pos){
    var cls='opt',sel=chosen===o,tag='';
    if(sel)cls+=' sel';
    if(reveal){
      if(o===q.ans){cls+=' ok';tag='<span class="tag ok">Đáp án đúng</span>'}
      else if(sel){cls+=' bad';tag='<span class="tag bad">Bạn chọn</span>'}
    }
    return '<button type="button" class="'+cls+'" role="radio" aria-checked="'+sel+'" data-o="'+o+'"'+(interactive?'':' data-static aria-disabled="true" tabindex="-1"')+'>'+
      '<span class="let">'+LET[pos]+'</span><span class="otxt">'+esc(q.opts[o])+'</span>'+tag+'</button>';
  }).join('')+'</div>';
}
function drawQuestion(){
  var qi=S.order[S.i],q=DATA[qi];
  var locked=S.cfg.mode==='practice'&&S.ans[qi]!==undefined;
  var fb='';
  if(locked){
    var right=S.ans[qi]===q.ans;
    var pos=S.perm[qi].indexOf(q.ans);
    fb='<p class="fb '+(right?'ok':'bad')+'">'+(right?'Chính xác.':'Chưa đúng. Đáp án đúng là '+LET[pos]+'.')+'</p>';
  }
  var last=S.i===S.order.length-1;
  $('#qwrap').innerHTML='<article class="card">'+
    '<div class="meta"><span class="qno">Câu '+(S.i+1)+'<small>/'+S.order.length+'</small></span>'+
    '<span class="chip">'+esc(scopeName(q))+'</span><span class="chip">'+TYPE[q.type]+'</span></div>'+
    '<p class="group">'+esc(q.group)+' &nbsp;(câu '+q.n+' trong bộ đề)</p>'+
    qBody(q)+optsHTML(qi,locked,!locked)+fb+'</article>'+
    '<div class="actions"><button class="btn" data-act="prev"'+(S.i===0?' disabled':'')+'>Câu trước</button>'+
    '<button class="btn flagbtn'+(S.flags[qi]?' on':'')+'" data-act="flag">'+(S.flags[qi]?'Đã đánh dấu':'Đánh dấu xem lại')+'</button>'+
    '<button class="btn '+(last?'primary':'')+'" data-act="next">'+(last?'Nộp bài':'Câu tiếp')+'</button></div>';
}
function drawNav(){
  var practice=S.cfg.mode==='practice';
  $('#side').innerHTML='<div class="side-h"><strong>Danh sách câu</strong><button class="btn x" id="closeNav">Đóng</button></div><div class="grid">'+
  S.order.map(function(qi,pos){
    var cls=[],a=S.ans[qi];
    if(pos===S.i)cls.push('cur');
    if(a!==undefined){cls.push(practice?(a===DATA[qi].ans?'ok':'bad'):'done')}
    if(S.flags[qi])cls.push('flag');
    return '<button class="'+cls.join(' ')+'" data-go="'+pos+'" aria-label="Câu '+(pos+1)+'">'+(pos+1)+'</button>';
  }).join('')+'</div><div class="legend">'+
  (practice?'<span><i class="l-ok"></i>Đúng</span><span><i class="l-bad"></i>Sai</span>':'<span><i class="l-done"></i>Đã trả lời</span>')+
  '<span><i></i>Chưa làm</span><span><i class="l-flag"></i>Đánh dấu</span></div>';
}
function drawTop(){
  var n=Object.keys(S.ans).length,t=S.order.length;
  $('#pbar').style.width=(n/t*100)+'%';
  $('#ptxt').textContent='Đã làm '+n+'/'+t;
}
function choose(o){
  if(S.submitted)return;
  var qi=S.order[S.i];
  if(S.cfg.mode==='practice'){if(S.ans[qi]!==undefined)return;S.ans[qi]=o}
  else{if(S.ans[qi]===o)delete S.ans[qi];else S.ans[qi]=o}
  save();drawQuestion();drawNav();drawTop();
}
function toggleFlag(){var qi=S.order[S.i];if(S.flags[qi])delete S.flags[qi];else S.flags[qi]=1;save();drawQuestion();drawNav()}
function go(i){
  if(i<0)return;
  if(i>=S.order.length){openSubmit();return}
  S.i=i;save();drawQuestion();drawNav();window.scrollTo(0,0);
}
document.addEventListener('keydown',function(e){
  if(ui.modal){if(e.key==='Escape')closeModal();return}
  if(document.body.dataset.view!=='test'||e.ctrlKey||e.metaKey||e.altKey)return;
  var tg=e.target&&e.target.tagName;if(tg==='INPUT'||tg==='SELECT'||tg==='TEXTAREA')return;
  var k=e.key.toLowerCase(),m='abcd1234'.indexOf(k);
  if(m>-1&&k.length===1){choose(S.perm[S.order[S.i]][m%4])}
  else if(k==='arrowright'||k==='n')go(S.i+1);
  else if(k==='arrowleft'||k==='p')go(S.i-1);
  else if(k==='f')toggleFlag();
});

/* timer */
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}
function startTimer(){
  stopTimer();if(!S.endAt)return;
  var tick=function(){
    var left=S.endAt-Date.now(),el=$('#timer');
    if(el){el.textContent=fmt(left);el.classList.toggle('warn',left<5*60000)}
    if(left<=0){stopTimer();if(!S.submitted)submit(true)}
  };
  tick();timerId=setInterval(tick,1000);
}

/* modal */
function openModal(html){ui.modal=true;var m=$('#modal');m.innerHTML='<div class="scrim2"><div class="dlg" role="dialog" aria-modal="true">'+html+'</div></div>';m.hidden=false;var b=m.querySelector('.btn.primary')||m.querySelector('.btn');if(b)b.focus()}
function closeModal(){ui.modal=false;var m=$('#modal');m.hidden=true;m.innerHTML=''}
function openSubmit(){
  var t=S.order.length,n=Object.keys(S.ans).length,un=t-n,fl=S.order.filter(function(q){return S.flags[q]}).length;
  openModal('<h3>Nộp bài?</h3><p>Đã trả lời <b>'+n+'/'+t+'</b> câu.</p>'+
    (un?'<p>Còn <b>'+un+'</b> câu chưa trả lời, các câu này tính là sai.</p>':'<p>Bạn đã trả lời tất cả các câu.</p>')+
    (fl?'<p>Có <b>'+fl+'</b> câu đang đánh dấu xem lại.</p>':'')+
    '<div class="btns"><button class="btn" id="mcancel">Làm tiếp</button><button class="btn primary" id="mok">Nộp bài</button></div>');
  $('#mcancel').onclick=closeModal;$('#mok').onclick=function(){closeModal();submit()};
}
function submit(auto){
  stopTimer();S.submitted=true;S.submittedAt=Date.now();save();ui.filter='all';
  showResult(auto);
}

/* ---------- result ---------- */
function tally(){
  var c=0,w=0,u=0;
  S.order.forEach(function(qi){var a=S.ans[qi];if(a===undefined)u++;else if(a===DATA[qi].ans)c++;else w++});
  return {c:c,w:w,u:u,t:S.order.length};
}
function agg(keyFn){
  var m={},ord=[];
  S.order.forEach(function(qi){
    var k=keyFn(DATA[qi]);if(!m[k]){m[k]={c:0,t:0};ord.push(k)}
    m[k].t++;if(S.ans[qi]===DATA[qi].ans)m[k].c++;
  });
  return ord.sort().map(function(k){return {k:k,c:m[k].c,t:m[k].t}});
}
function brk(rows,label){
  return rows.map(function(r){
    var nm=label(r.k);
    return '<div class="nm">'+nm+'</div><div class="tr"><i style="width:'+(r.c/r.t*100)+'%"></i></div><div class="v">'+r.c+'/'+r.t+'</div>';
  }).join('');
}
function showResult(auto){
  stopTimer();document.body.dataset.view='result';document.body.classList.remove('nav-open');ui.modal=false;
  $('#top').hidden=false;
  $('#top').innerHTML='<div class="top-in"><button class="brand" id="home2">Tư tưởng Hồ Chí Minh - '+DATA.length+' câu</button><div class="prog"></div><button class="btn" id="again0">Làm bài mới</button></div>';
  $('#home2').onclick=showStart;$('#again0').onclick=showStart;
  var r=tally(),pct=r.c/r.t*100,s10=(r.c/r.t*10);
  var used=fmt((S.submittedAt||Date.now())-S.startedAt);
  var cloTitle={};DATA.forEach(function(q){cloTitle[q.clo]=scopeName(q)});
  var wrongN=r.w+r.u;
  $('#view').innerHTML=
  '<section class="res-hero"><h1>Kết quả</h1>'+(auto?'<p class="sub2">Hết giờ, bài được nộp tự động.</p>':'')+
  '<div class="big">'+r.c+'<small>/'+r.t+'</small></div>'+
  '<p class="sub2">'+pct.toFixed(0)+'% đúng, tương đương '+s10.toFixed(1).replace('.',',')+'/10 điểm. Thời gian làm bài '+used+'.</p></section>'+
  '<section class="panel"><div class="seg" role="img" aria-label="Đúng '+r.c+', sai '+r.w+', bỏ trống '+r.u+'"><i class="s-ok" style="width:'+(r.c/r.t*100)+'%"></i><i class="s-bad" style="width:'+(r.w/r.t*100)+'%"></i><i class="s-na" style="width:'+(r.u/r.t*100)+'%"></i></div>'+
  '<div class="counts"><span><i class="dot ok"></i><b>'+r.c+'</b> đúng</span><span><i class="dot bad"></i><b>'+r.w+'</b> sai</span><span><i class="dot na"></i><b>'+r.u+'</b> bỏ trống</span></div></section>'+
  '<div class="two"><section class="panel"><h2>Theo nội dung</h2><div class="brk">'+
    brk(agg(function(q){return q.clo}),function(k){return esc(cloTitle[k])})+'</div></section>'+
  '<section class="panel"><h2>Theo mức độ</h2><div class="brk">'+
    brk(agg(function(q){return q.type}),function(k){return TYPE[k]})+'</div></section></div>'+
  '<div class="row" style="margin:6px 0 4px">'+
    '<button class="btn primary" id="again">Làm lại toàn bộ</button>'+
    (wrongN?'<button class="btn" id="retry">Làm lại '+wrongN+' câu sai hoặc bỏ trống</button>':'')+
    '<button class="btn" id="home3">Về trang đầu</button></div>'+
  '<div class="chips" id="chips"></div><div class="revlist" id="revlist"></div>';
  $('#again').onclick=function(){startSession(S.cfg)};
  if($('#retry'))$('#retry').onclick=function(){
    var sub=S.order.filter(function(qi){return S.ans[qi]!==DATA[qi].ans});
    startSession(S.cfg,sub);
  };
  $('#home3').onclick=showStart;
  drawReview();
  window.scrollTo(0,0);
}
function drawReview(){
  var f=ui.filter;
  var st=function(qi){var a=S.ans[qi];return a===undefined?'na':(a===DATA[qi].ans?'ok':'bad')};
  var counts={all:S.order.length,bad:0,na:0,flag:0};
  S.order.forEach(function(qi){var s=st(qi);if(s==='bad')counts.bad++;if(s==='na')counts.na++;if(S.flags[qi])counts.flag++});
  var defs=[['all','Tất cả'],['bad','Sai'],['na','Bỏ trống'],['flag','Đã đánh dấu']];
  $('#chips').innerHTML=defs.map(function(d){return '<button class="fchip" data-f="'+d[0]+'" aria-pressed="'+(f===d[0])+'">'+d[1]+' ('+counts[d[0]]+')</button>'}).join('');
  $('#chips').onclick=function(e){var b=e.target.closest('[data-f]');if(b){ui.filter=b.dataset.f;drawReview()}};
  var list=S.order.map(function(qi,pos){return {qi:qi,pos:pos}}).filter(function(x){
    var s=st(x.qi);
    return f==='all'||(f==='bad'&&s==='bad')||(f==='na'&&s==='na')||(f==='flag'&&S.flags[x.qi]);
  });
  $('#revlist').innerHTML=list.length?list.map(function(x){
    var q=DATA[x.qi],s=st(x.qi);
    var label=s==='ok'?'Đúng':(s==='bad'?'Sai':'Bỏ trống');
    return '<article class="card"><div class="meta"><span class="qno">Câu '+(x.pos+1)+'</span><span class="chip st-'+s+'">'+label+'</span>'+
      '<span class="chip">'+esc(scopeName(q))+'</span><span class="chip">'+TYPE[q.type]+'</span></div>'+ 
      '<p class="group">'+esc(q.group)+' &nbsp;(câu '+q.n+' trong bộ đề)</p>'+qBody(q)+optsHTML(x.qi,true,false)+'</article>';
  }).join(''):'<div class="empty">Không có câu nào trong mục này.</div>';
}

/* init */
showStart();
})();
</script>
</body>
</html>
